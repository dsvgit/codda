# Checks every PR and every push to main; a push to main is then deployed to
# the pilot on GitHub Pages, https://dsvgit.github.io/codda/. Tickets
# .scratch/misc/issues/01-ci-bootstrap.md and 02-pages-deploy.md, decision in
# .scratch/mvp/issues/06-ci-and-pilot-hosting.md. The `check` job is the
# required status check in main's branch protection.
#
# `deploy` publishes the very Course Build that `check` built and tested
# (`npm run test:e2e` builds the UI, runs `codda build courses/react-hooks`
# into courses/react-hooks/dist/ and runs the e2e against it from /codda/),
# without rebuilding.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # Keep in sync with `playwright` and `@playwright/test` in package.json
      # and `playwright` in packages/codda/package.json (pinned exactly, no ^):
      # the image ships the browsers for exactly this Playwright version. Bump
      # them all together.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      # Same condition as the `deploy` job below.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: courses/react-hooks/dist/

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a queued one waits instead of cancelling the
    # running one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
